<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LosMoya BJJ Journey</title>
<meta name="description" content="A private jiu-jitsu training journal that works offline.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJJ Journey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="top">
  <header class="belt">
    <div class="belt-inner">
      <p class="brand">LosMoya BJJ Journey</p>
      <div class="rank">
        <span class="rank-label" id="rank-label"></span>
        <button class="rankbar" id="rankbar" data-act="tab" data-view="stats"></button>
      </div>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections"><div class="tabs-inner" id="tabs"></div></nav>
</div>
<main id="app" tabindex="-1"><p class="muted">Loading your journal…</p></main>
<button class="btn fab" data-act="new-session">+ Log training</button>
<dialog id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
